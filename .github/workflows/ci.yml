name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check . || true   # TODO: drop `|| true` once the tree is clean
      - name: Test
        run: pytest -q || true      # TODO: drop `|| true` once tests exist (80% target)

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install & build
        working-directory: web
        run: |
          npm install
          npm run build || true     # TODO: drop `|| true` once the app shell exists
