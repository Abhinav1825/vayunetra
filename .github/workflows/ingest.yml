name: ingest (data refresh)

# Data-pipeline crons (ARCHITECTURE.md §7.4). Owner: Abhinav.
# GitHub Actions only runs workflows from .github/workflows/ (infra/workflows/ is the doc home).
# Public repo -> unlimited free minutes.
on:
  schedule:
    - cron: "5 * * * *"     # hourly: ground + weather ingest
    - cron: "30 1 * * *"    # 01:30 UTC daily: forecast rollup + enforcement run
  workflow_dispatch:

jobs:
  ingest-ground-weather:
    name: Ingest ground + weather measurements
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Ingest ground + weather → measurements
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        # --push is what actually persists rows — without it this job fetches
        # summaries and discards them (measurements went stale for 3 days).
        run: |
          python -m connectors.openaq --city delhi --days 2 --push || true
          python -m connectors.openaq --city bengaluru --days 2 --push || true
          python -m connectors.openaq --city mumbai --days 2 --push || true
          python -m connectors.openmeteo --city delhi --push || true
          python -m connectors.openmeteo --city bengaluru --push || true
          python -m connectors.openmeteo --city mumbai --push || true
      - name: Keep-alive ping (prevents Supabase project pause)
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          import os, sys
          try:
              from core.supa import client
              db = client()
              db.table('cities').select('city_id').limit(1).execute()
              print('Keep-alive ping sent.')
          except Exception as e:
              print(f'Keep-alive skipped (demo/no creds): {e}')
          " || true

  forecast-enforcement-rollup:
    name: Daily forecast + enforcement run
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 1 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Ingest RAG corpus
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python -m rag.ingest
      - name: Refresh emission-source registry from OSM (auto add/remove sites)
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Clears each city's enforcement_recs (FK) — regenerated by the next step.
        # "|| true": Overpass flakiness must not kill the daily run.
        run: |
          python -m connectors.osm_sources --city delhi --push || true
          sleep 30
          python -m connectors.osm_sources --city bengaluru --push || true
          sleep 30
          python -m connectors.osm_sources --city mumbai --push || true
      - name: Refresh forecasts + attribution (model outputs must track the data)
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for c in delhi bengaluru mumbai; do
            python -m ml.forecast.train --city $c --write || true
            python -m ml.attribution.attribute --city $c --write || true
          done
      - name: Run multi-agent enforcement pipeline for all cities
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: "gemini"
        run: |
          python -c "
          from agents.graph import run_query
          for city in ['delhi', 'bengaluru', 'mumbai']:
              state = run_query(city_id=city, query='daily scheduled pipeline')
              print(f'{city}: {len(state.get(\"enforcement\") or [])} enforcement recs, latency={state.get(\"latency_ms\", 0)}ms')
          "
      - name: Refresh citizen advisories from the new forecasts
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: "gemini"
        run: python scripts/refresh_advisories.py || true
